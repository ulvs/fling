# Fling Gateway on a Linux server: the gateway, Caddy for HTTPS, and Litestream for backups.
# Guide: ../docker-compose.md
services:
  gateway:
    # In production, pin a version: ghcr.io/ulvs/fling-gateway:sha-<commit> or @sha256:<digest>.
    image: ghcr.io/ulvs/fling-gateway:latest
    restart: unless-stopped
    env_file: fling-gateway.env
    volumes:
      - data:/data
    networks: [fling]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [fling]

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    user: "65532:65532" # the same user as the gateway, so it can read the database
    command: replicate
    env_file: litestream.env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks: [fling]

networks:
  fling:
    ipam:
      config:
        - subnet: 172.30.0.0/24 # FLING_TRUSTED_PROXIES trusts Caddy's address from here

volumes:
  data:
  caddy-data:
  caddy-config:
