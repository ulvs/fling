# Local development: gateway + a local S3 server (Versity Gateway, which verifies SigV4 like real S3).
# Not for production: fixed dev credentials, plain HTTP.
#   docker compose -f compose.dev.yml up --build
# API calls:  Authorization: Bearer dev-token-change-me-0123456789abcdef
services:
  s3-init:
    image: busybox:1.36
    command: ["mkdir", "-p", "/data/fling-dev", "/meta"]
    volumes:
      - s3-data:/data
      - s3-meta:/meta

  s3:
    image: versity/versitygw:latest
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      ROOT_ACCESS_KEY_ID: devaccesskey
      ROOT_SECRET_ACCESS_KEY: devsecretkey0123456789
      VGW_PORT: ":9000"
    command: ["posix", "--sidecar", "/meta", "/data"]
    volumes:
      - s3-data:/data
      - s3-meta:/meta
    ports:
      - "9000:9000"
      - "8080:8080" # the gateway shares this network namespace

  gateway:
    build: .
    depends_on:
      - s3
    environment:
      FLING_PUBLIC_URL: http://localhost:8080
      # Presigned URLs must be reachable from the client, so sign them for localhost:9000.
      FLING_S3_ENDPOINT: http://localhost:9000
      FLING_S3_BUCKET: fling-dev
      FLING_S3_ACCESS_KEY: devaccesskey
      FLING_S3_SECRET_KEY: devsecretkey0123456789
      FLING_DEV_TOKEN: dev-token-change-me-0123456789abcdef
    volumes:
      - gateway-data:/data
    network_mode: "service:s3"

volumes:
  s3-data:
  s3-meta:
  gateway-data:
