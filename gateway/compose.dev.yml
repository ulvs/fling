# Local development: gateway + a local S3 server (Versity Gateway, which verifies SigV4 like real S3)
# + a fake sign-in provider (mock-oauth2-server). Not for production: fixed dev credentials, plain HTTP.
#   docker compose -f compose.dev.yml up --build
# Browser: http://localhost:8080, "Continue with Dev sign-in". On the fake login form, enter any
#   user name and these claims:  {"email": "ann@example.com", "email_verified": true}
# Local accounts: docker compose -f compose.dev.yml exec gateway fling-gateway user invite bo@example.com
#   prints an invite link (no email in dev).
# API calls:  Authorization: Bearer dev-token-change-me-0123456789abcdef
services:
  s3-init:
    image: busybox:1.36
    command: ["mkdir", "-p", "/data/fling-dev", "/meta"]
    volumes:
      - s3-data:/data
      - s3-meta:/meta

  s3:
    image: versity/versitygw:latest
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      ROOT_ACCESS_KEY_ID: devaccesskey
      ROOT_SECRET_ACCESS_KEY: devsecretkey0123456789
      VGW_PORT: ":9000"
    command: ["posix", "--sidecar", "/meta", "/data"]
    volumes:
      - s3-data:/data
      - s3-meta:/meta
    ports:
      - "9000:9000"
      - "8080:8080" # the gateway shares this network namespace
      - "8090:8090" # and so does the sign-in server, so browser and gateway both reach it as localhost:8090

  signin:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: '{"interactiveLogin": true}'
    network_mode: "service:s3"
    depends_on:
      - s3

  gateway:
    build: .
    depends_on:
      - s3
      - signin
    environment:
      FLING_PUBLIC_URL: http://localhost:8080
      # Presigned URLs must be reachable from the client, so sign them for localhost:9000.
      FLING_S3_ENDPOINT: http://localhost:9000
      FLING_S3_BUCKET: fling-dev
      FLING_S3_ACCESS_KEY: devaccesskey
      FLING_S3_SECRET_KEY: devsecretkey0123456789
      FLING_DEV_TOKEN: dev-token-change-me-0123456789abcdef
      FLING_OIDC_ISSUER: http://localhost:8090/default
      FLING_OIDC_CLIENT_ID: fling-dev
      FLING_OIDC_CLIENT_SECRET: fling-dev-secret
      FLING_OIDC_NAME: Dev sign-in
      FLING_MEMBER_EMAILS: ann@example.com
      # Local accounts: docker compose -f compose.dev.yml exec gateway fling-gateway user invite bo@example.com
      FLING_LOCAL_ACCOUNTS: "true"
    volumes:
      - gateway-data:/data
    network_mode: "service:s3"

volumes:
  s3-data:
  s3-meta:
  gateway-data:
