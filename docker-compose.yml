# Local S3 server for Fling.Tests' integration tests (bucket "fling-test", keys minioadmin/minioadmin).
# MinIO no longer publishes its images on Docker Hub, so this uses Versity Gateway, which also verifies
# SigV4 signatures like real S3.
#   docker compose up -d
services:
  s3-init:
    image: busybox:1.36
    command: ["mkdir", "-p", "/data/fling-test", "/meta"]
    volumes:
      - s3_data:/data
      - s3_meta:/meta

  s3:
    image: versity/versitygw:latest
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      ROOT_ACCESS_KEY_ID: minioadmin
      ROOT_SECRET_ACCESS_KEY: minioadmin
      VGW_PORT: ":9000"
    command: ["posix", "--sidecar", "/meta", "/data"]
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data
      - s3_meta:/meta

volumes:
  s3_data:
  s3_meta:
